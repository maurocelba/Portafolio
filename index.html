<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mauricio Celedón Portafolio</title>
<link rel="icon" id="fav" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3efe4'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='29' font-weight='700' fill='%2315235c'%3EMC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Time and how it is perceived. The home page starts in a deep blue and clears toward today.
   One line crosses it. Its frequency follows a scale of consciousness from 160 to 300:
   it starts slow and wide, and grows denser, steadier and faster as the years pass.
   The stages are never named; colour, the line and what moves behind it carry them, and each opens with a milestone.
   Each section has its own ground: sky for projects, blackboard for teaching, blueprint for implementation, paper for the CV. */
:root{
  color-scheme: light dark;
  --bg:#15235c; --fg:#f3efe4; --acc:#f6cf4a;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --name:"Fraunces",Georgia,"Times New Roman",serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{--mut:color-mix(in srgb,var(--fg) 74%,transparent);--rule:color-mix(in srgb,var(--fg) 16%,transparent);
  --kp:#8ea6ff; --kd:#3fd6c4; --kq:#f58fcb; --kh:#f6cf4a}
body.lite{--kp:#2a48d8; --kd:#0b8577; --kq:#a8327f; --kh:#9a6400; --acc:#9a6400}
body[data-view="proyectos"]{--bg:#e4edff;--fg:#0f1a3a;--acc:#2a48d8}
body[data-view="docencia"]{--bg:#0f322c;--fg:#f1efe2;--acc:#ffe08a}
body[data-view="implementador"]{--bg:#f5edf4;--fg:#2a1230;--acc:#9a3478}
body[data-view="cv"]{--bg:#f7f0df;--fg:#0f1a3a;--acc:#9a6400}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--fg);font:400 16px/1.5 var(--display);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body:not([data-view="inicio"]){transition:background-color .5s}
body[data-view="proyectos"]{background-image:linear-gradient(180deg,#d6e4ff 0,#eef3ff 46%,#f8faff 100%);background-attachment:fixed}
body[data-view="docencia"]{background-image:radial-gradient(40vw 26vw at 12% 18%,rgba(241,239,226,.07),transparent 70%),radial-gradient(34vw 22vw at 88% 62%,rgba(241,239,226,.06),transparent 70%),radial-gradient(60vw 30vw at 50% 110%,rgba(255,224,138,.07),transparent 70%);background-attachment:fixed}
body[data-view="implementador"]{background-image:radial-gradient(50vw 34vw at 95% 5%,rgba(176,74,140,.13),transparent 70%),radial-gradient(44vw 30vw at 0% 90%,rgba(106,63,176,.1),transparent 70%);background-attachment:fixed}
body[data-view="cv"]{background-image:radial-gradient(60vw 60vw at 100% 0,rgba(240,179,35,.28),transparent 60%),radial-gradient(50vw 50vw at 0 100%,rgba(31,54,199,.1),transparent 60%);background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:.95}
p{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.mono{font:500 11.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.wrap{width:min(1240px,100%);margin:0 auto;padding:0 clamp(16px,4vw,44px)}
.lg{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--mut);font:500 9.5px/1 var(--mono);letter-spacing:.02em;color:var(--fg);flex:none;vertical-align:middle}

/* soft light behind the projects page */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .6s}
body[data-view="proyectos"] .bg{opacity:1}
.blob{position:absolute;border-radius:50%;filter:blur(80px);background:#fff;will-change:transform}
.blob.a{width:46vw;height:22vw;left:-8vw;top:12vh;animation:driftA 38s ease-in-out infinite alternate}
.blob.b{width:40vw;height:18vw;right:-6vw;top:38vh;background:#c9d9ff;animation:driftB 46s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(12vw,3vh)}}
@keyframes driftB{to{transform:translate(-14vw,-4vh)}}
.grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

/* top panel */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;align-items:center;gap:14px;min-height:58px}
.mark{display:flex;align-items:center;gap:10px;font:500 20px/1 var(--name);font-variation-settings:"opsz" 30,"SOFT" 60;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.mark i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 13px/1 var(--name);font-style:normal;letter-spacing:0}
.nav nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav nav::-webkit-scrollbar{display:none}
.nav nav a{position:relative;font:500 15px/1 var(--display);font-variation-settings:"wdth" 92;text-decoration:none;color:var(--mut);padding:11px 12px;white-space:nowrap;transition:color .2s}
.nav nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.nav nav a:hover,.nav nav a.on{color:var(--fg)}
.nav nav a:hover::after,.nav nav a.on::after{transform:scaleX(1)}
.lang{display:flex;gap:6px;align-items:center;flex:none}
.lang button{display:block;width:26px;height:18px;border-radius:3px;overflow:hidden;opacity:.45;box-shadow:0 0 0 1px var(--rule);transition:opacity .2s,transform .2s,box-shadow .2s}
.lang button svg{display:block;width:100%;height:100%}
.lang button:hover{opacity:.85;transform:translateY(-1px)}
.lang button.on{opacity:1;box-shadow:0 0 0 2px var(--acc)}

.view{display:none;padding-bottom:30px}
.view.on{display:block;animation:viewIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.3;transform:translateY(14px)}}
.wipe{position:fixed;inset:0;z-index:50;background:linear-gradient(165deg,#2646a3,#15235c 70%);color:#f3efe4;display:grid;place-items:center;transform:translateY(101%);pointer-events:none;text-align:center}
.wipe.in{transition:transform .42s cubic-bezier(.76,0,.24,1);transform:none}
.wipe.out{transition:transform .5s cubic-bezier(.76,0,.24,1);transform:translateY(-101%)}
.wipe b{display:block;font:300 clamp(46px,10vw,140px)/.9 var(--name);font-style:italic;letter-spacing:-.02em}

/* hero: the name comes into focus over a living frequency */
.hero{position:relative;padding:clamp(30px,6vw,80px) 0 18px}
#heroCv{position:absolute;left:calc(-1 * clamp(16px,4vw,44px));right:calc(-1 * clamp(16px,4vw,44px));top:0;height:clamp(300px,52vw,620px);width:calc(100% + 2 * clamp(16px,4vw,44px));pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1}
.hero #heroCv{position:absolute;z-index:0}
.name{font-family:var(--name);font-weight:480;font-size:clamp(56px,11.4vw,172px);line-height:.92;letter-spacing:-.025em;margin:14px 0 0;font-variation-settings:"opsz" 144,"SOFT" 60,"WONK" 1;text-shadow:0 0 60px color-mix(in srgb,var(--fg) 18%,transparent)}
.name .w{display:block;white-space:nowrap}
.name .w:nth-child(2){padding-left:.9em}
.name .w:nth-child(3){padding-left:1.8em;font-style:italic}
.name .ch{display:inline-block;font-variation-settings:"opsz" 144,"wght" var(--wg,480),"SOFT" 60,"WONK" 1;transition:font-variation-settings .45s cubic-bezier(.2,.8,.2,1);animation:focusIn 1.5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n) * 55ms)}
@keyframes focusIn{from{opacity:0;filter:blur(18px);transform:translateY(.22em);font-variation-settings:"opsz" 144,"wght" 120,"SOFT" 100,"WONK" 1}}
.hero .sub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,72px);align-items:end;margin-top:clamp(26px,4vw,48px)}
.thesis{font:italic 400 clamp(28px,3.8vw,50px)/1.06 var(--serif);margin:0;max-width:20ch;letter-spacing:-.01em;text-align:left}
.bio{margin:0;font-size:clamp(16px,1.45vw,18.5px);max-width:48ch;color:color-mix(in srgb,var(--fg) 88%,transparent)}
.three{display:flex;flex-wrap:wrap;gap:clamp(22px,5vw,72px);margin-top:clamp(30px,5vw,56px)}
.three a{text-decoration:none;display:block;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.three a:hover{transform:translateY(-5px)}
.three b{display:block;font:300 clamp(54px,7.4vw,104px)/.85 var(--name);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.03em}
.three span{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.marq{margin-top:34px;overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:inline-flex;gap:26px;padding:6px 0;animation:marq 60s linear infinite}
.marq .lg{width:46px;height:46px;font-size:12px;border-color:var(--rule)}
@keyframes marq{to{transform:translateX(-50%)}}
.tl-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:end;justify-content:space-between;margin:clamp(44px,7vw,96px) 0 0}
.tl-head h2{font:300 clamp(38px,6vw,84px)/.95 var(--name);letter-spacing:-.025em}
.tl-head h2 em{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:8px}

/* the line and what hangs from it */
.tline{position:relative;margin-top:10px}
#lineCv{position:sticky;top:0;display:block;width:100%;height:100vh;margin-bottom:-100vh;pointer-events:none;z-index:0}
.row{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);padding:16px 0}
.row.gate{padding-top:clamp(90px,14vw,170px)}
.row.L .it{grid-column:1;justify-self:end;text-align:right}
.row.R .it{grid-column:3;justify-self:start}
.it{width:min(100%,420px);will-change:opacity,transform,filter}
.it h3{font-size:20px;font-weight:650;font-variation-settings:"wdth" 90;line-height:1.15;margin:0;letter-spacing:-.005em}
.it h3 a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .35s cubic-bezier(.2,.8,.2,1)}
.it h3 a:hover{background-size:100% 1.5px}
.it .when{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:5px;font:500 11.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.it .rl{margin-top:7px;font:600 16.5px/1.25 var(--display);font-variation-settings:"wdth" 92;color:var(--k)}
.it .ent{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.row.L .it .when,.row.L .it .ent{justify-content:flex-end}
.it .ent a{text-underline-offset:3px;text-decoration-color:var(--rule)}
.it .ent a:hover{color:var(--fg);text-decoration-color:currentColor}
.now-row{position:relative;z-index:1;text-align:center;padding:90px 0 40px}
.now-row b{display:block;font:300 clamp(64px,12vw,170px)/.85 var(--name);font-style:italic;letter-spacing:-.03em}
.now-row p{margin:14px auto 0;max-width:40ch;color:var(--mut);text-align:center}
.hud{position:fixed;left:50%;bottom:clamp(10px,2vw,22px);z-index:25;pointer-events:none;opacity:0;transform:translate(-50%,14px);transition:opacity .4s,transform .4s;display:flex;align-items:center;gap:14px;padding:6px 20px 8px;border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud.on{opacity:1;transform:translate(-50%,0)}
.hud .yr{font:300 clamp(28px,3.4vw,44px)/.95 var(--name);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.03em}
.hud .bar{width:clamp(70px,10vw,150px);height:3px;background:var(--rule);border-radius:3px;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:var(--fg)}

/* section pages */
.shead{padding:clamp(30px,5vw,64px) 0 0}
.shead h2{font-size:clamp(34px,10.4vw,150px);font-weight:800;font-variation-settings:"wdth" 78;text-transform:uppercase;letter-spacing:-.02em;line-height:.84;-webkit-hyphens:none;hyphens:none}
.shead h2 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{transform:translateY(105%)}}
.shead .lead{font:italic 400 clamp(21px,2.5vw,32px)/1.1 var(--serif);max-width:38ch;margin:16px 0 0;color:color-mix(in srgb,var(--fg) 88%,transparent);text-align:left}
.kpis{display:flex;flex-wrap:wrap;gap:clamp(20px,5vw,72px);margin-top:clamp(22px,3.4vw,40px)}
.kpis b{display:block;font:800 clamp(40px,5.6vw,78px)/.88 var(--display);font-variation-settings:"wdth" 78;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--acc)}
.kpis b.pend{font:italic 400 clamp(26px,3vw,38px)/1.25 var(--serif);letter-spacing:0;opacity:.8}
.kpis span{display:block;margin-top:6px;font-size:14.5px;color:var(--mut);max-width:24ch}

/* section timelines: one calm track per item, a year grid and today */
.band{position:relative;overflow-x:auto;overflow-y:hidden;margin:clamp(24px,3.4vw,40px) 0 0;scrollbar-width:thin;-webkit-overflow-scrolling:touch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.chart{position:relative}
.c-docencia,.c-implementador{border:0;border-radius:18px;background:color-mix(in srgb,var(--bg) 55%,transparent);box-shadow:inset 0 0 0 1px var(--rule)}
.c-docencia{background:color-mix(in srgb,#0b2723 80%,transparent)}
.c-implementador{background:color-mix(in srgb,#fff 70%,transparent)}
.lane{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.lane.alt{background:color-mix(in srgb,var(--fg) 3.5%,transparent)}
.lane b{position:sticky;left:0;display:inline-block;margin:10px 0 0 14px;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);background:color-mix(in srgb,#fff 80%,transparent);padding:4px 7px;border-radius:5px}
.c-implementador .bar.ln-bpo i{background:linear-gradient(90deg,#c9b6ee,#6a3fb0)}
.c-implementador .bar.ln-bpo.on i{background:linear-gradient(90deg,#4a2a80,#24133f)}
.c-implementador .bar.ln-aud i{width:14px;height:14px;margin-left:1px;clip-path:none;transform:rotate(45deg);background:#1b8a8a;border:2px solid #fff;box-shadow:0 0 0 1px rgba(27,138,138,.4);animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 25ms)}
.c-implementador .bar.ln-aud:hover i{background:#11a3a3}
.c-implementador .bar.ln-aud.on i{background:#2a1230}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.gl em{position:absolute;top:8px;left:5px;font:500 10.5px/1 var(--mono);font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.gl.odd em{opacity:.55}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--acc)}
.today em{position:absolute;bottom:6px;left:6px;font:500 10.5px/1 var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.trk{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.bar{position:absolute;height:32px;display:flex;align-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.bar i{position:relative;display:block;width:100%;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 40ms);transition:background .25s,filter .25s,box-shadow .25s}
@keyframes grow{from{transform:scaleX(0);opacity:0}}
.bar .nm,.mk .nm{position:absolute;left:0;bottom:calc(100% + 4px);width:max-content;max-width:250px;white-space:normal;text-align:left;padding:9px 12px 10px;border-radius:10px;background:var(--bg);color:var(--fg);border:1px solid var(--rule);box-shadow:0 14px 30px -14px rgba(0,0,0,.45);opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:6}
.nm b{display:block;font-size:13.5px;font-weight:650;line-height:1.25;text-wrap:balance}
.nm small{display:block;margin-top:5px;font:500 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nm em{display:block;margin-top:3px;font-style:normal;font-size:12.5px;font-weight:600;color:var(--acc)}
.bar.dn .nm,.mk.dn .nm{bottom:auto;top:calc(100% + 4px);transform:translateY(-5px)}
.bar.rt .nm,.mk.rt .nm{left:auto;right:0}
.bar:hover .nm,.bar:focus-visible .nm,.bar.on .nm,.mk:hover .nm,.mk:focus-visible .nm{opacity:1;transform:none}
.bar:not(.on) .nm{z-index:7}
.chart:hover .bar.on:not(:hover) .nm{opacity:0}
.mk{position:absolute;width:0;height:32px;display:flex;align-items:center;z-index:2;cursor:default;outline:none}
.mk:hover,.mk:focus-visible{z-index:8}
.mk i{position:absolute;left:-8px;width:16px;height:16px;transform:rotate(45deg);background:#f0b323;border:2px solid #fff;box-shadow:0 0 0 1px rgba(154,100,0,.4);animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 80ms + .3s)}
@keyframes pop{from{transform:rotate(45deg) scale(0)}}
.sprof{max-width:72ch;margin:16px 0 0;font-size:clamp(15.5px,1.3vw,17px);line-height:1.6;color:color-mix(in srgb,var(--fg) 86%,transparent)}
.det dd .src{display:block;margin-top:2px;font:500 11px/1.4 var(--mono);letter-spacing:.04em;color:var(--mut)}
.bar:hover,.bar:focus-visible{z-index:8}.bar.on{z-index:5}
/* projects: a trail that ends in a point of light */
.c-proyectos .bar i{height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(42,72,216,.05),rgba(42,72,216,.6))}
.c-proyectos .bar i::after{content:"";position:absolute;right:-6px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#2a48d8;box-shadow:0 0 0 4px rgba(42,72,216,.16)}
.c-proyectos .bar:hover i{background:linear-gradient(90deg,rgba(42,72,216,.1),#2a48d8)}
.c-proyectos .bar.on i{background:linear-gradient(90deg,rgba(15,26,58,.15),#0f1a3a)}
.c-proyectos .bar.on i::after{background:#0f1a3a;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,72,216,.45)}100%{box-shadow:0 0 0 14px rgba(42,72,216,0)}}
/* teaching: chalk outlines */
.c-docencia .bar i{height:14px;border-radius:999px;border:2px solid #ffe08a;background:rgba(255,224,138,.1)}
.c-docencia .bar:hover i{background:rgba(255,224,138,.35)}
.c-docencia .bar.on i{background:#ffe08a;border-color:#fff}
/* implementation: machined hexagonal parts */
.c-implementador .bar i{height:18px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);background:linear-gradient(90deg,#e7b3d6,#b04a8c)}
.c-implementador .bar:hover i{filter:brightness(1.08) saturate(1.2)}
.c-implementador .bar.on i{background:linear-gradient(90deg,#6b2a5a,#2a1230)}
